[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-distinction-theory"
version = "1.0.0"
description = "Reproducibility software for Physical Distinction Theory"
authors = [{name="Mohammad Amir Khusru Akhtar"}]
license = {text="Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
