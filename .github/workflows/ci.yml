name: PDT verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack software
        run: unzip -q Physical_Distinction_Theory_Software.zip -d pdt_software
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Install
        working-directory: pdt_software
        run: pip install -e . pytest
      - name: Verify all equations and benchmarks
        working-directory: pdt_software
        run: python scripts/verify_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdt-results
          path: pdt_software/results/
